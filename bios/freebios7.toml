# Generated by tools/import_freebios_symbols.py from the
# FreeBIOS assembly source (third_party/freebios/bios_common.S,
# the github.com/mstan/freebios submodule), which reassembles
# byte-identical to the shipped image. Re-run the importer; do not
# hand-edit.

