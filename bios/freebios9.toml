# freebios9.toml — recompile config for the FreeBIOS image
# (third_party/freebios/drastic_bios_arm9.bin, BSD-2-Clause).
#
# Generated by tools/import_freebios_symbols.py from the
# FreeBIOS assembly source (third_party/freebios/bios_common.S,
# the github.com/mstan/freebios submodule), which reassembles
# byte-identical to the shipped image. Re-run the importer; do not
# hand-edit.

[program]
name         = "FreeBIOS ARM9"
id           = "freebios9"
cpu          = "arm9"
isa          = "armv5te"
load_address = 0xFFFF0000
size         = 0x00001000
entry_pc     = 0xFFFF0000

[identity]
